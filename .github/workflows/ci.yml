name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
      - name: Validate dependencies and compile
        run: |
          python -m pip check
          python -m compileall -q agents shamir_mpc_agent cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Audit trail integrity smoke test
        run: |
          python - <<'PY'
          import os
          import secrets
          os.environ["AUDIT_SECRET_KEY"] = secrets.token_hex(32)
          from agents.base import AuditLogger
          AuditLogger.log("ci", "test", "CHECK", {"status": "TEST"})
          assert AuditLogger.verify_integrity()
          print("Authenticated audit chain verified")
          PY

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax and functional tests
        run: |
          node --check web/shamir.js
          node --test tests/web.test.cjs
