[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shamir-secret-sharing-mpc"
version = "2.0.0"
description = "Shamir (k, n) Verifiable Threshold Secret Sharing & Distributed Key Generation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
shamir-secret-sharing-mpc = "shamir_mpc_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/shamir-secret-sharing-mpc"
Repository = "https://github.com/abusuraihsakhri/shamir-secret-sharing-mpc.git"
